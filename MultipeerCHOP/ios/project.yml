# XcodeGen 仕様。このフォルダで `xcodegen generate` → TDSensor.xcodeproj を生成。
# 生成済み .xcodeproj は Xcode で直接開いてビルドできる(xcodegen は再生成にのみ必要)。
name: TDSensor
options:
  bundleIdPrefix: tokyo.sygnal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
targets:
  TDSensor:
    type: application
    platform: iOS
    sources:
      - path: TDSensor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.sygnal.tdsensor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: TDSensor/Info.plist
